# Generado por scripts/render.ts. No editar a mano.
backend:
  name: github
  repo: Soukt/travis-kb-poc
  branch: master
  base_url: http://localhost:8080
  auth_endpoint: auth
  auth_scope: public_repo
  squash_merges: true
publish_mode: editorial_workflow
media_folder: media
locale: es
collections:
  - name: acciones
    label: Acciones (catálogo)
    label_singular: Acción
    folder: acciones
    create: true
    identifier_field: name
    fields:
      - label: Nombre
        name: name
        widget: string
      - label: Descripción
        name: description
        widget: text
      - label: Simulado
        name: simulado
        widget: hidden
        default: "true"
      - label: Notas
        name: body
        widget: markdown
        required: false
  - name: alojamiento
    label: Alojamiento
    label_singular: Caso
    folder: casos/alojamiento
    path: "{{slug}}/SKILL"
    create: true
    identifier_field: name
    summary: "{{description}}"
    sortable_fields:
      - name
    view_filters:
      - label: Responde solo
        field: metadata.modo
        pattern: autonomo
      - label: "Copiloto: lo revisa booking antes de enviarlo"
        field: metadata.modo
        pattern: copiloto
      - label: Lo pasa a booking
        field: metadata.modo
        pattern: persona
    fields:
      - label: Nombre
        name: name
        widget: string
        hint: Identificador del caso. Empieza por aloj- y usa solo minúsculas, números y guiones.
        pattern:
          - ^aloj(-[a-z0-9]+)+$
          - Empieza por aloj- y usa solo minúsculas, números y guiones
      - label: Descripción
        name: description
        widget: text
        hint: Una frase que empiece por «El cliente…» y diga cuándo aplica. El agente decide con esto si usa el caso.
      - label: Datos del caso
        name: metadata
        widget: object
        collapsed: false
        fields:
          - label: Área
            name: area
            widget: hidden
            default: alojamiento
          - label: Modo
            name: modo
            widget: select
            options:
              - label: Responde solo
                value: autonomo
              - label: "Copiloto: lo revisa booking antes de enviarlo"
                value: copiloto
              - label: Lo pasa a booking
                value: persona
          - label: Acciones que usa
            name: acciones
            widget: relation
            collection: acciones
            search_fields:
              - name
              - description
            value_field: name
            display_fields:
              - name
            multiple: true
            required: false
          - label: Simulado
            name: simulado
            widget: hidden
            default: "true"
      - label: Instrucciones
        name: body
        widget: markdown
        default: |+
          ## Cuándo aplica


          ## Qué hace el agente


          ## Qué no hace


          ## Cuándo pasa a una persona


          ## Cómo lo puede pedir el cliente

